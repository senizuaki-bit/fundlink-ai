<title id="title">FundLink AI：双端共用的平台架构</title>
<desc id="desc">实线为当前统一基础链路。投资端与融资端经身份授权 API 进入共用证据、匹配、Agent 和业务服务。事件反馈回流至匹配、画像建议和风险复核；跨账户认领、双方独立确认以及新线索定时发现列为规划。</desc>
